<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Bondegaarden">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#e9f7ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc24a"/><stop offset="1" stop-color="#4f9a33"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="540" cy="70" r="34" fill="#ffe27a"/>
  <!-- island -->
  <polygon points="320,120 600,260 320,400 40,260" fill="url(#grass)"/>
  <polygon points="40,260 320,400 320,420 40,280" fill="#7a5236"/>
  <polygon points="320,400 600,260 600,280 320,420" fill="#5e3d27"/>
  <!-- fields -->
  <g opacity="0.95">
    <polygon points="150,250 230,210 310,250 230,290" fill="#8a5a3a"/>
    <polygon points="250,300 330,260 410,300 330,340" fill="#a8763f"/>
    <g fill="#f2c12e">
      <circle cx="210" cy="240" r="5"/><circle cx="230" cy="250" r="5"/><circle cx="250" cy="260" r="5"/>
      <circle cx="190" cy="250" r="5"/><circle cx="210" cy="260" r="5"/><circle cx="230" cy="270" r="5"/>
    </g>
    <g fill="#e8455a">
      <circle cx="310" cy="290" r="5"/><circle cx="330" cy="300" r="5"/><circle cx="350" cy="310" r="5"/>
      <circle cx="290" cy="300" r="5"/><circle cx="310" cy="310" r="5"/><circle cx="330" cy="320" r="5"/>
    </g>
  </g>
  <!-- road -->
  <polyline points="330,140 420,185 380,205 500,265" fill="none" stroke="#c9a46a" stroke-width="10" stroke-linejoin="round"/>
  <!-- barn -->
  <polygon points="390,190 430,210 430,170 390,150" fill="#b8412f"/>
  <polygon points="430,210 470,190 470,150 430,170" fill="#8f3022"/>
  <polygon points="390,150 430,170 450,140 410,120" fill="#5d4b43"/>
  <polygon points="430,170 470,150 450,140" fill="#44362f"/>
  <polygon points="440,195 460,185 460,165 440,175" fill="#f1e6d2"/>
  <!-- farmhouse -->
  <polygon points="250,190 280,205 280,180 250,165" fill="#f6f0e4"/>
  <polygon points="280,205 305,192 305,167 280,180" fill="#d9cfbe"/>
  <polygon points="250,165 280,180 292,155 262,140" fill="#c0392b"/>
  <polygon points="280,180 305,167 292,155" fill="#96281b"/>
  <rect x="258" y="176" width="8" height="8" fill="#9fd0ec"/>
  <!-- trees -->
  <g fill="#2f7d3a"><circle cx="120" cy="240" r="14"/><circle cx="140" cy="228" r="12"/><circle cx="530" cy="250" r="14"/><circle cx="510" cy="262" r="11"/></g>
  <!-- tractor -->
  <g transform="translate(345,240)">
    <rect x="-14" y="-12" width="22" height="10" rx="2" fill="#f2c12e"/>
    <rect x="-6" y="-22" width="12" height="11" rx="2" fill="#f2c12e"/>
    <rect x="-4" y="-20" width="8" height="6" fill="#bfe3f5"/>
    <circle cx="4" cy="0" r="7" fill="#222"/><circle cx="4" cy="0" r="3" fill="#f2c12e"/>
    <circle cx="-12" cy="2" r="4" fill="#222"/>
  </g>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="42" font-weight="800" fill="#1d2520">Bondegaarden</text>
</svg>
